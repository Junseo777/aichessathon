[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14", "pytest>=8.0"]
train = ["torch>=2.2", "onnx>=1.16"]

[tool.pytest.ini_options]
testpaths = ["chessml", "harness", "train"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"train/*" = ["N812"]

[tool.mypy]
strict = true
files = ["agent.py", "harness", "chessml"]

[[tool.mypy.overrides]]
module = "onnxruntime.*"
ignore_missing_imports = true
